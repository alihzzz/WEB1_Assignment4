<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4 - Part 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="active">Part 1: Basic Forms</a>
        <a href="part2.html">Part 2: Bootstrap Forms</a>
        <a href="part3.html">Part 3: Registration Form</a>
    </nav>

    <div class="form-container">
        <h2>Contact Form</h2>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Name:</label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    required 
                    minlength="2" 
                    maxlength="50" 
                    placeholder="Enter your name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    required 
                    placeholder="example@domain.com"
                >
            </div>

            <div class="form-group">
                <label for="message">Message:</label>
                <textarea 
                    id="message" 
                    name="message" 
                    required 
                    minlength="10" 
                    maxlength="500" 
                    placeholder="Write your message here..."
                ></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
